# Entry point of the platform's catalog, read by the portal (modules/portal). Add your teams and
# people to catalog/org.yaml, and app repositories' catalog files as Locations here or in the portal
# module's catalogLocations setting.
apiVersion: backstage.io/v1alpha1
kind: Location
metadata:
  name: platform
  description: Everything in the platform repository
spec:
  targets:
    - ./catalog/org.yaml
    - ./catalog/platform.yaml
    - ./modules/portal/templates/catalog.yaml
    # Generated by `bluepave render`: what the templates need to know about the platform.
    - ./.bluepave/platform-settings.yaml
---
# Services created from the portal's templates (services/<name>/). Optional: there may be none yet.
apiVersion: backstage.io/v1alpha1
kind: Location
metadata:
  name: services
  description: Services in the platform repository
spec:
  presence: optional
  targets:
    - ./services/*/catalog-info.yaml
