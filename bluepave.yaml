# The platform's configuration: the only file to edit after creating your repository from the
# bluepave template. `bluepave validate` checks it against api/v1alpha1/platform.schema.json.
# The values below are an example (acme); replace them with yours.
apiVersion: bluepave.dev/v1alpha1
kind: Platform
metadata:
  name: acme-platform
spec:
  prefix: acme
  profile: trial
  azure:
    region: westeurope
  environments: [dev]
  dns:
    domain: platform.example.com
  github:
    owner: acme
    platformRepo: acme-platform
  admins:
    group: acme-platform-admins
  modules:
    runtime-falco:
      enabled: false
