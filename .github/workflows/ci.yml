name: ci

# Every change: the CLI builds and its tests pass, every profile and example validates against
# the config API, and every module manifest is valid (ADR-0001, quality bar).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# One run per pull request: a new push cancels the previous run. Runs on main always finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cli:
    name: CLI and config API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Format, vet, test
        run: |
          unformatted=$(gofmt -l .)
          [[ -z $unformatted ]] || { echo "::error::not gofmt-ed: $unformatted"; exit 1; }
          go vet ./...
          go test -race -count=1 -timeout 5m ./...

      - name: Build the CLI
        run: go build -o "$RUNNER_TEMP/bluepave" ./cmd/bluepave

      - name: Example and every profile validate
        run: |
          "$RUNNER_TEMP/bluepave" validate -f bluepave.yaml
          for p in profiles/*.yaml; do
            name=$(basename "$p" .yaml)
            sed "s/profile: trial/profile: $name/" bluepave.yaml > "$RUNNER_TEMP/$name.yaml"
            "$RUNNER_TEMP/bluepave" validate -f "$RUNNER_TEMP/$name.yaml"
          done

      - name: Every module manifest is valid
        run: '"$RUNNER_TEMP/bluepave" modules'

      - name: .bluepave/ (resolved modules, platform settings) is up to date
        run: '"$RUNNER_TEMP/bluepave" render -check'

  gitops:
    name: GitOps layer (charts and policy tests)
    runs-on: ubuntu-latest
    env:
      HELM_VERSION: v4.3.0
      HELM_SHA256: 86584a54def73570558f66f5111cc53dfed56689637ae32c1201205d494f54fb
      YQ_VERSION: v4.47.2
      YQ_SHA256: 1bb99e1019e23de33c7e6afc23e93dad72aad6cf2cb03c797f068ea79814ddb0
      KUBECONFORM_VERSION: v0.7.0
      KUBECONFORM_SHA256: c31518ddd122663b3f3aa874cfe8178cb0988de944f29c74a0b9260920d115d3
      KYVERNO_VERSION: v1.19.1
      KYVERNO_SHA256: b38228f367fc0fdc2b08f4c83ea50ac5f16c60ff8d62d76a66157c33c47b70ae
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install helm, yq, kubeconform, kyverno (pinned, checksums verified)
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/bin"; mkdir -p "$bin"; cd "$RUNNER_TEMP"
          curl -sSLo helm.tgz "https://get.helm.sh/helm-$HELM_VERSION-linux-amd64.tar.gz"
          echo "$HELM_SHA256  helm.tgz" | sha256sum -c -
          tar xzf helm.tgz --strip-components=1 -C "$bin" linux-amd64/helm
          curl -sSLo "$bin/yq" "https://github.com/mikefarah/yq/releases/download/$YQ_VERSION/yq_linux_amd64"
          echo "$YQ_SHA256  $bin/yq" | sha256sum -c -
          curl -sSLo kubeconform.tgz "https://github.com/yannh/kubeconform/releases/download/$KUBECONFORM_VERSION/kubeconform-linux-amd64.tar.gz"
          echo "$KUBECONFORM_SHA256  kubeconform.tgz" | sha256sum -c -
          tar xzf kubeconform.tgz -C "$bin" kubeconform
          curl -sSLo kyverno.tgz "https://github.com/kyverno/kyverno/releases/download/$KYVERNO_VERSION/kyverno-cli_${KYVERNO_VERSION}_linux_x86_64.tar.gz"
          echo "$KYVERNO_SHA256  kyverno.tgz" | sha256sum -c -
          tar xzf kyverno.tgz -C "$bin" kyverno
          chmod +x "$bin"/*
          echo "$bin" >> "$GITHUB_PATH"

      # bluepave render -> root chart -> module charts -> upstream charts, every profile, with
      # made-up discovered IDs so the paths that need them render too (ADR-0002).
      - name: Render and validate
        run: hack/test-gitops.sh

      # Kyverno CLI tests of every module's admission policies.
      - name: Policy tests
        run: hack/test-policies.sh

      # The portal's templates, dry run: render each like Backstage, then the onboarding file,
      # chart, workflow and code a new service would get must pass the platform's own checks.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Template tests
        run: hack/test-templates.sh

  infra:
    name: Module infra layers (Bicep)
    runs-on: ubuntu-latest
    env:
      BICEP_VERSION: v0.47.16
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Bicep
        run: az bicep install --version "$BICEP_VERSION"

      # Every module's infra layer and the shared library build and lint cleanly, with the
      # repository's bluepave.yaml under every profile (the library reads them at compile time).
      - name: Build and lint, per profile
        run: |
          set -euo pipefail
          cp bluepave.yaml "$RUNNER_TEMP/bluepave.orig.yaml"
          status=0
          for profile in profiles/*.yaml; do
            name=$(basename "$profile" .yaml)
            sed "s/profile: trial/profile: $name/" "$RUNNER_TEMP/bluepave.orig.yaml" > bluepave.yaml
            for f in lib/bicep/platform.test.bicep modules/*/infra/main.bicep; do
              [[ -f $f ]] || continue
              if out=$(az bicep build --file "$f" --stdout 2>&1 >/dev/null) && ! grep -qE 'Warning|Error' <<<"$out"; then
                echo "ok   $name  $f"
              else
                echo "::error file=$f::($name) $out"; status=1
              fi
            done
          done
          cp "$RUNNER_TEMP/bluepave.orig.yaml" bluepave.yaml
          exit $status

      # `bluepave up` records each template's outputs; module.yaml must declare exactly those.
      - name: Declared outputs match the templates
        run: hack/check-outputs.sh

  # The golden path itself, on a fixture app: source checks, image build and scan (no publish, so
  # no Azure). A change to build-app.yml is tested here before any app uses it.
  golden-path:
    name: Golden path (build-app.yml)
    uses: ./.github/workflows/build-app.yml
    # What an app's caller grants. A called workflow's jobs can't have more than this, and its
    # publish job declares id-token: write; it doesn't run here (publish is off).
    permissions:
      contents: read
      id-token: write
    with:
      app: hello
      app-dir: hack/fixtures/hello
