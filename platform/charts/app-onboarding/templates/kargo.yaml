{{- $ctx := .Values.bluepave }}
{{- $name := .Values.metadata.name }}
{{- $stages := (include "onboarding.stages" . | fromYaml).stages }}
{{- $registry := include "onboarding.registry" . }}
{{- $images := (.Values.spec.delivery | default dict).images | default list }}
{{- if and (has "delivery-kargo" $ctx.modules) $registry $images $stages }}
{{- $o := include "kargo.open" . -}}
{{- $repo := include "onboarding.repoURL" . -}}
{{- $branch := .Values.spec.source.targetRevision | default "main" -}}
{{- $valuesDir := dir .Values.spec.source.path -}}
# The app's Kargo pipeline, generated by the platform. Kargo commits promotions to the app's
# repository with the platform's GitHub App (kargo-shared-resources/github-app, delivery-kargo).
apiVersion: kargo.akuity.io/v1alpha1
kind: Project
metadata:
  name: kargo-{{ $name }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
---
# The first stage gets every new Freight automatically; later stages are promoted by hand.
apiVersion: kargo.akuity.io/v1alpha1
kind: ProjectConfig
metadata:
  name: kargo-{{ $name }}
  namespace: kargo-{{ $name }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  promotionPolicies:
    - stageSelector:
        name: {{ (first $stages).name }}
      autoPromotionEnabled: true
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: {{ $name }}
  namespace: kargo-{{ $name }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  interval: 2m0s
  {{- if gt (len $images) 1 }}
  # Freight only when every image comes from the same commit.
  freightCreationCriteria:
    expression: |
      {{- range $i, $img := $images }}{{ if $i }} &&{{ end }}
      imageFrom('{{ $registry }}/{{ $name }}-{{ $img }}').Tag == imageFrom('{{ $registry }}/{{ $name }}-{{ first $images }}').Tag
      {{- end }}
  {{- end }}
  subscriptions:
    {{- range $images }}
    - image:
        repoURL: {{ $registry }}/{{ $name }}-{{ . }}
        imageSelectionStrategy: NewestBuild
        allowTagsRegexes: ['^[0-9a-f]{40}$'] # commit SHAs only (skips signature tags)
        platform: linux/amd64
        discoveryLimit: 5
    {{- end }}
{{- range $i, $stage := $stages }}
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: {{ $stage.name }}
  namespace: kargo-{{ $name }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: {{ $name }}
      sources:
        {{- if eq $i 0 }}
        direct: true
        {{- else }}
        stages:
          - {{ (index $stages (sub $i 1)).name }}
        {{- end }}
  promotionTemplate:
    spec:
      vars:
        - name: gitRepo
          value: {{ $repo }}
        - name: valuesFile
          value: {{ $valuesDir }}/values-{{ $stage.name }}.yaml
        - name: app
          value: {{ include "onboarding.namespace" (dict "app" $name "stage" $stage) }}
      steps:
        - uses: git-clone
          config:
            repoURL: {{ $o }} vars.gitRepo }}
            checkout:
              - branch: {{ $branch }}
                path: ./repo
        - uses: yaml-update
          as: update
          config:
            path: ./repo/{{ $o }} vars.valuesFile }}
            updates:
              {{- range $images }}
              # The full repository too, so app charts never name the registry.
              - key: images.{{ . }}.repository
                value: {{ $registry }}/{{ $name }}-{{ . }}
              - key: images.{{ . }}.digest
                value: {{ $o }} imageFrom("{{ $registry }}/{{ $name }}-{{ . }}").Digest }}
              - key: images.{{ . }}.tag
                value: {{ $o }} imageFrom("{{ $registry }}/{{ $name }}-{{ . }}").Tag }}
              {{- end }}
        - uses: git-commit
          as: commit
          config:
            path: ./repo
            message: |
              promote({{ $o }} ctx.stage }}): {{ $name }} {{ $o }} imageFrom("{{ $registry }}/{{ $name }}-{{ first $images }}").Tag }}

              {{ $o }} outputs.update.commitMessage }}
        - uses: git-push
          retry:
            errorThreshold: 3
          config:
            path: ./repo
        - uses: argocd-update
          retry:
            errorThreshold: 5
            timeout: 20m
          config:
            apps:
              - name: {{ $o }} vars.app }}
{{- end }}
---
# Who may promote: the platform admins (Entra group, in the user's token).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: promoter
  namespace: kargo-{{ $name }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
rules:
  - apiGroups: [kargo.akuity.io]
    resources: [stages]
    verbs: [get, list, watch, promote]
  - apiGroups: [kargo.akuity.io]
    resources: [promotions, freights]
    verbs: [get, list, watch, create]
{{- with $ctx.admins.groupObjectId }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: promoter-platform-admins
  namespace: kargo-{{ $name }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: promoter
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: {{ . }} # the platform admins group
{{- end }}
{{- end }}
