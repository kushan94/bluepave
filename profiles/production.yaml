# production: private cluster, filtered egress, private endpoints, zone redundancy.
# Not yet proven end to end: see docs/design/configuration.md.
apiVersion: bluepave.dev/v1alpha1
kind: Profile
metadata:
  name: production
spec:
  cluster:
    tier: Standard
    kubernetesVersion: "1.35"
    autoUpgrade: true
    systemPool: { vmSize: Standard_D2ds_v5, count: 3, maxCount: 5, criticalAddonsOnly: true }
    userPools:
      - { name: apps, vmSize: Standard_D4ds_v5, spot: false, minCount: 3, maxCount: 6, surge: true }
    privateCluster: true
    advancedNetworking: true
    addons: { keda: true, vpa: true, imageCleaner: true }
  network:
    egress: firewall
    allowPublicNetworkAccess: false
    privateEndpoints: true
  registry: { sku: Premium, repositoryPermissions: true, armTokenAuth: false }
  keyVault: { purgeProtection: true, softDeleteDays: 90 }
  logs: { retentionDays: 90, dailyQuotaGb: -1 }
  budget: { monthly: 2000 }
  data:
    postgres: { skuName: Standard_D2ds_v5, tier: GeneralPurpose, storageSizeGB: 64, highAvailability: ZoneRedundant, geoRedundantBackup: true, backupRetentionDays: 35 }
    cache: azureManagedRedis       # AppCache = Azure Managed Redis, Entra ID auth (ADR-0003)
  ingress: inCluster              # Envoy Gateway; Application Gateway for Containers (agc) isn't implemented yet
  modules:
    defaultsEnabled: [governance, monitoring, dns, network, registry, keyvault, aks, data-postgres, gitops-argocd, secrets-external, certificates, delivery-kargo, rollouts, policy-kyverno, runtime-falco, edge-gateway, observability]
