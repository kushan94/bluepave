# Generated by `bluepave render` from bluepave.yaml, the profile and the module manifests.
# Do not edit: CI fails when it's out of date. The GitOps root chart (platform/chart) reads it.
resolved:
  profile: trial
  profileSpec:
    budget:
      monthly: 100
    cluster:
      addons:
        imageCleaner: false
        keda: false
        vpa: false
      advancedNetworking: false
      autoUpgrade: false
      kubernetesVersion: "1.35"
      privateCluster: false
      systemPool:
        count: 1
        criticalAddonsOnly: false
        maxCount: 1
        vmSize: Standard_D2ds_v5
      tier: Free
      userPools:
        - maxCount: 1
          minCount: 0
          name: spot
          spot: true
          surge: false
          vmSize: Standard_D2ds_v5
        - maxCount: 1
          minCount: 1
          name: apps
          spot: false
          surge: false
          vmSize: Standard_D2ds_v5
    data:
      cache: inCluster
      postgres:
        backupRetentionDays: 7
        geoRedundantBackup: false
        highAvailability: Disabled
        skuName: Standard_B1ms
        storageSizeGB: 32
        tier: Burstable
    ingress: inCluster
    keyVault:
      purgeProtection: false
      softDeleteDays: 7
    logs:
      dailyQuotaGb: 1
      retentionDays: 30
    modules:
      defaultsEnabled:
        - governance
        - monitoring
        - dns
        - network
        - registry
        - keyvault
        - aks
        - data-postgres
        - gitops-argocd
        - secrets-external
        - certificates
        - delivery-kargo
        - rollouts
        - policy-kyverno
        - runtime-falco
        - edge-gateway
        - observability
        - self-service
    network:
      allowPublicNetworkAccess: true
      egress: loadBalancer
      privateEndpoints: false
    registry:
      armTokenAuth: true
      repositoryPermissions: true
      sku: Standard
  modules:
    - name: monitoring
      version: 0.1.0
    - name: network
      version: 0.1.0
    - name: registry
      version: 0.1.0
    - name: aks
      version: 0.1.0
    - name: dns
      version: 0.1.0
    - name: gitops-argocd
      version: 0.1.0
      gitops: modules/gitops-argocd/gitops
      sources:
        - url: https://argoproj.github.io/argo-helm
          type: helm
      hostnames:
        - name: argocd
          namespace: argocd
    - name: certificates
      version: 0.1.0
      gitops: modules/certificates/gitops
      sources:
        - url: https://charts.jetstack.io
          type: helm
      settings:
        acmeEmail: platform-team@example.com
    - name: data-postgres
      version: 0.1.0
    - name: keyvault
      version: 0.1.0
    - name: secrets-external
      version: 0.1.0
      gitops: modules/secrets-external/gitops
      sources:
        - url: https://charts.external-secrets.io
          type: helm
    - name: delivery-kargo
      version: 0.1.0
      gitops: modules/delivery-kargo/gitops
      sources:
        - url: ghcr.io/akuity/kargo-charts
          type: oci
    - name: edge-gateway
      version: 0.1.0
      gitops: modules/edge-gateway/gitops
      sources:
        - url: docker.io/envoyproxy
          type: oci
        - url: https://kubernetes-sigs.github.io/external-dns
          type: helm
    - name: governance
      version: 0.1.0
    - name: observability
      version: 0.1.0
      gitops: modules/observability/gitops
      sources:
        - url: https://open-telemetry.github.io/opentelemetry-helm-charts
          type: helm
        - url: https://grafana.github.io/helm-charts
          type: helm
      hostnames:
        - name: grafana
          namespace: observability
    - name: policy-kyverno
      version: 0.1.0
      gitops: modules/policy-kyverno/gitops
      sources:
        - url: https://kyverno.github.io/kyverno
          type: helm
    - name: rollouts
      version: 0.1.0
      gitops: modules/rollouts/gitops
      sources:
        - url: https://argoproj.github.io/argo-helm
          type: helm
    - name: runtime-falco
      version: 0.1.0
      gitops: modules/runtime-falco/gitops
      sources:
        - url: https://falcosecurity.github.io/charts
          type: helm
    - name: self-service
      version: 0.1.0
      gitops: modules/self-service/gitops
      sources:
        - url: https://raw.githubusercontent.com/Azure/azure-service-operator/main/v2/charts
          type: helm
        - url: registry.k8s.io/kro/charts
          type: oci
