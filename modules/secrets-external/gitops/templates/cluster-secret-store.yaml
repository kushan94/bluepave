{{- /*
Every namespace can read this environment's Key Vault through this store, as the module's identity
(Key Vault Secrets User on that vault only). App projects may not create ExternalSecrets (app
onboarding), so in practice only platform modules use it. Rendered once the vault's URI is
discovered.
*/ -}}
{{- $vault := index .Values.bluepave.discovered "keyvault" | default dict }}
{{- if $vault.keyVaultUri }}
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: azure-keyvault
  annotations:
    # The CRD comes with the external-secrets Application, which may sync after this one.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  provider:
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: {{ $vault.keyVaultUri | quote }}
      serviceAccountRef:
        name: external-secrets
        namespace: external-secrets
{{- end }}
