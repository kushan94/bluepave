{{- $ctx := .Values.bluepave }}
{{- $ids := index $ctx.discovered "secrets-external" | default dict }}
{{- $tolerations := $ctx.scheduling.tolerations }}
{{- $env := dict
  "tolerations" $tolerations
  "webhook" (dict "tolerations" $tolerations)
  "certController" (dict "tolerations" $tolerations)
  "serviceAccount" (dict "annotations" (dict))
}}
{{- if $ids.clientId }}
{{- $_ := set $env.serviceAccount.annotations "azure.workload.identity/client-id" $ids.clientId }}
{{- end }}
{{- $values := mergeOverwrite (.Files.Get "files/external-secrets-values.yaml" | fromYaml) $env }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: {{ .Values.upstream.repoURL | quote }}
    chart: {{ .Values.upstream.chart | quote }}
    targetRevision: {{ .Values.upstream.version | quote }}
    helm:
      releaseName: external-secrets
      valuesObject:
        {{- toYaml $values | nindent 8 }}
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
