# Base values for the external-secrets chart. templates/external-secrets.yaml adds the identity's
# client ID and scheduling.

installCRDs: true

serviceAccount:
  name: external-secrets

# Workload Identity: the pod gets an Entra token for the module's managed identity.
podLabels:
  azure.workload.identity/use: "true"

resources:
  requests: { cpu: 10m, memory: 64Mi }
  limits: { memory: 256Mi }

webhook:
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 128Mi }

certController:
  resources:
    requests: { cpu: 10m, memory: 64Mi }
    limits: { memory: 256Mi }
