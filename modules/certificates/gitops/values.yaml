# Set by the root chart (platform/chart) for every module: the module context and this module's
# settings (ADR-0002). The defaults here only make the chart render on its own (helm lint).
bluepave:
  environment: dev
  subscriptionId: ""
  modules: []
  discovered: {}
  scheduling: { tolerations: [] }
settings: {}

# The upstream chart. Bumped by module releases, after the end-to-end test.
upstream:
  repoURL: https://charts.jetstack.io
  chart: cert-manager
  version: v1.21.2
