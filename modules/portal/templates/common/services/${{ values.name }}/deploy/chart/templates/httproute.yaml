{{- if .Values.route.hostname }}
# Public HTTPS route through the platform's Gateway; external-dns creates the DNS record and the
# Gateway's wildcard certificate covers it.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ${{ values.component }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.route.gateway.name }}
      namespace: {{ .Values.route.gateway.namespace }}
      sectionName: https
  hostnames:
    - {{ .Values.route.hostname | quote }}
  rules:
    - filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: max-age=31536000; includeSubDomains
      backendRefs:
        - name: ${{ values.component }}
          port: {{ .Values.port }}
{{- end }}
