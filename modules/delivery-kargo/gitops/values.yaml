# Set by the root chart (platform/chart) for every module: the module context and this module's
# settings (ADR-0002). The defaults here only make the chart render on its own (helm lint).
bluepave:
  environment: dev
  github: { owner: example, platformRepo: example }
  modules: []
  discovered: {}
  scheduling: { tolerations: [] }
settings: {}

# The upstream chart (an OCI registry). Bumped by module releases, after the end-to-end test.
upstream:
  repoURL: ghcr.io/akuity/kargo-charts
  chart: kargo
  version: 1.12.1
