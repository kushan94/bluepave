{{- /*
Secrets Kargo needs, from Key Vault (secrets-external). `bluepave up` creates them:
  kargo-admin-password, kargo-admin-password-hash, kargo-token-signing-key   the admin account
  github-app-id, github-app-installation-id, github-app-private-key         the platform GitHub App
*/ -}}
{{- $ctx := .Values.bluepave }}
# The admin account's bcrypt password hash and token-signing key. The plain password stays in Key
# Vault (kargo-admin-password).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kargo-api
  namespace: kargo
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-keyvault
  target:
    name: kargo-api
  data:
    - { secretKey: ADMIN_ACCOUNT_PASSWORD_HASH, remoteRef: { key: kargo-admin-password-hash } }
    - { secretKey: ADMIN_ACCOUNT_TOKEN_SIGNING_KEY, remoteRef: { key: kargo-token-signing-key } }
---
# The platform GitHub App as Git credentials for every repository of the owner. Credentials in the
# shared-resources namespace are available to every Kargo project, so each app's pipeline can
# commit promotions to its own repository with short-lived installation tokens.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-app
  namespace: kargo-shared-resources
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-keyvault
  target:
    name: github-app
    template:
      metadata:
        labels:
          kargo.akuity.io/cred-type: git
      data:
        repoURL: {{ printf "^https://github\\.com/%s/.+$" $ctx.github.owner | quote }}
        repoURLIsRegex: "true"
        githubAppID: {{ "{{ .appId }}" | quote }}
        githubAppInstallationID: {{ "{{ .installationId }}" | quote }}
        githubAppPrivateKey: {{ "{{ .privateKey }}" | quote }}
  data:
    - { secretKey: appId, remoteRef: { key: github-app-id } }
    - { secretKey: installationId, remoteRef: { key: github-app-installation-id } }
    - { secretKey: privateKey, remoteRef: { key: github-app-private-key } }
