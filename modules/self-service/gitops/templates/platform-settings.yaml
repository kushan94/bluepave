{{- /*
Per-environment values the platform APIs read (externalRef). Rendered once `bluepave up` has
recorded this module's outputs.
*/ -}}
{{- $ctx := .Values.bluepave }}
{{- $ids := include "ss.ids" . | fromYaml }}
{{- if $ids.appsResourceGroupId }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-settings
  namespace: kro-system
data:
  subscriptionId: {{ $ctx.subscriptionId | quote }}
  location: {{ $ctx.region | quote }}
  appsResourceGroupId: {{ $ids.appsResourceGroupId | quote }}
  oidcIssuer: {{ $ids.oidcIssuerUrl | quote }}
  # Seed for globally unique names (storage accounts): differs per subscription and environment.
  nameSeed: {{ printf "%s/%s" $ctx.subscriptionId $ctx.environment | quote }}
  {{- if eq (include "ss.appDatabase" .) "true" }}
  {{- $pg := index $ctx.discovered "data-postgres" | default dict }}
  {{- $net := index $ctx.discovered "network" | default dict }}
  # AppDatabase: the PostgreSQL server (data-postgres), the admin role the jobs sign in as, and
  # where the server's private endpoint is (network).
  tenantId: {{ $ctx.tenantId | quote }}
  postgresHost: {{ $pg.postgresFqdn | default "" | quote }}
  postgresAdminName: {{ $ids.postgresAdminName | default "" | quote }}
  privateEndpointSubnetPrefix: {{ $net.privateEndpointSubnetPrefix | default "" | quote }}
  {{- end }}
{{- end }}
