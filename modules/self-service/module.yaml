apiVersion: bluepave.dev/v1alpha1
kind: Module
metadata:
  name: self-service
  description: Platform APIs apps use to get backing services (AppStorage, AppCache), built on Azure Service Operator and kro
spec:
  version: 0.1.0
  requires: [aks, gitops-argocd]
  outputs: [clientId, appsResourceGroupId, oidcIssuerUrl]
  sources:
    - { url: https://raw.githubusercontent.com/Azure/azure-service-operator/main/v2/charts, type: helm }
    - { url: registry.k8s.io/kro/charts, type: oci }
  # The in-cluster cache behind AppCache (data.cache: inCluster), allowed in app namespaces.
  appImages:
    - docker.io/valkey/valkey:9.1.2-alpine@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11
  config:
    schema: config.schema.json
  layers:
    infra: infra/main.bicep
    gitops: gitops
    docs: docs
  tests: tests
