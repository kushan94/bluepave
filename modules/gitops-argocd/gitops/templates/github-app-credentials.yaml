{{- /*
With secrets-external enabled: the platform's GitHub App as Git credentials for every repository
of the GitHub owner (the platform repository and app repositories). Argo CD mints short-lived
installation tokens from the App's key, so no personal token or deploy key exists. `bluepave up`
stores the App's ID, installation ID and private key in Key Vault.
*/ -}}
{{- $ctx := .Values.bluepave }}
{{- if has "secrets-external" $ctx.modules }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-app
  namespace: argocd
  annotations:
    # The CRD comes with the secrets-external module, which may sync after this one.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-keyvault
  target:
    name: github-app
    template:
      metadata:
        labels:
          # A credential template: applies to every repository under this URL prefix.
          argocd.argoproj.io/secret-type: repo-creds
      data:
        type: git
        url: {{ printf "https://github.com/%s" $ctx.github.owner | quote }}
        githubAppID: {{ "{{ .appId }}" | quote }}
        githubAppInstallationID: {{ "{{ .installationId }}" | quote }}
        githubAppPrivateKey: {{ "{{ .privateKey }}" | quote }}
  data:
    - { secretKey: appId, remoteRef: { key: github-app-id } }
    - { secretKey: installationId, remoteRef: { key: github-app-installation-id } }
    - { secretKey: privateKey, remoteRef: { key: github-app-private-key } }
{{- end }}
