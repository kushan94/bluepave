# Set by the root chart (platform/chart) for every module: the module context and this module's
# settings (ADR-0002). The defaults here only make the chart render on its own (helm lint).
bluepave:
  environment: dev
  domain: dev.example.com
  tenantId: ""
  admins: { group: example-admins, groupObjectId: "" }
  modules: []
  discovered: {}
  scheduling: { tolerations: [], highAvailability: true }
  gateway: { name: public, namespace: gateway }
settings: {}

# The upstream charts. Bumped by module releases, after the end-to-end test.
# grafana and tempo come from grafana-community: Grafana Labs moved the charts there on 2026-01-30
# and froze the copies at grafana.github.io/helm-charts.
upstream:
  otelCollector:
    repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
    chart: opentelemetry-collector
    version: 0.175.0
  tempo:
    repoURL: https://grafana-community.github.io/helm-charts
    chart: tempo
    version: 3.1.0
  grafana:
    repoURL: https://grafana-community.github.io/helm-charts
    chart: grafana
    version: 13.2.7
