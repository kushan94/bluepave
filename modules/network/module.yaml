apiVersion: bluepave.dev/v1alpha1
kind: Module
metadata:
  name: network
  description: Hub-and-spoke network per environment, egress per profile, private DNS for Private Link
spec:
  version: 0.1.0
  infraScope: environment
  requires: [monitoring]
  outputs: [spokeVnetId, hubVnetId, egress, firewallPrivateIp]
  config:
    schema: config.schema.json
  layers:
    infra: infra/main.bicep
    docs: docs
  tests: tests
