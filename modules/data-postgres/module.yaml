apiVersion: bluepave.dev/v1alpha1
kind: Module
metadata:
  name: data-postgres
  description: PostgreSQL Flexible Server per environment, Entra ID authentication only, reachable only through a private endpoint
spec:
  version: 0.1.0
  infraScope: environment
  requires: [monitoring, network]
  outputs: [postgresServerName, postgresFqdn]
  config:
    schema: config.schema.json
  layers:
    infra: infra/main.bicep
    docs: docs
  tests: tests
